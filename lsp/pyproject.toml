[project]
    name            = "docassemble-lsp"
    version         = "26.7.0"
    description     = "Docassemble language server with shared core APIs for CLI and editors"
    readme          = "README.md"
    requires-python = ">=3.10"
    license         = "Apache-2.0"
    license-files   = [
        "LICENSE",
    ]
    authors         = [
        { name = "Jack Adamson" },
    ]
    dependencies    = [
        "black>=26.1.0",
        "esprima2>=6.0.0",
        "jinja2>=3.1.6",
        "lsprotocol>=2025.0.0",
        "mako>=1.3.12",
        "pygls>=2.1.1",
        "ruamel-yaml>=0.18.17",
        "tomli>=2.3.0",
    ]

    [project.urls]
        Repository = "https://github.com/jpagh/docassemble-yaml"

    [project.scripts]
        docassemble-lsp = "docassemble_lsp.cli:main"

[dependency-groups]
    dev  = [
        "docassemble-base>=1.9.13",
        "docassemble-webapp>=1.9.13",
        "pytest>=9.1.1",
        "pytest-cov>=7.1.0",
        "pytest-xdist>=3.8.0",
    ]
    test = [
        "pytest>=9.1.1",
        "pytest-xdist>=3.8.0",
    ]

[build-system]
    requires      = [
        "uv_build>=0.12.0,<0.13",
    ]
    build-backend = "uv_build"

[tool.pyrefly]
    preset           = "default"
    project-includes = [
        "**/*.py*",
        "**/*.ipynb",
    ]
    project-excludes = [
        "tests/**",
        "scripts/**",
        "src/docassemble_lsp/data/**",
    ]

[tool.pytest.ini_options]
    # docassemble-pattern 3.6.7 uses deprecated codecs.open() in
    # docassemble_pattern.vector, which DeprecationWarns on py3.14+.
    filterwarnings = [
        "ignore::DeprecationWarning:docassemble_pattern\\.vector",
    ]
    pythonpath     = [
        "src",
    ]

[tool.ruff]
    line-length = 88
