[tools]
    "pipx:ruff" = "latest"
    uv          = "latest"

[tasks."format:check"]
    description = "Check Kakoune example tooling formatting"
    depends     = ["//:format:toml:check"]
    run         = "ruff format --check scripts tests"

[tasks.lint]
    description = "Lint Kakoune example tooling"
    depends     = ["//:lint:toml"]
    run         = "ruff check scripts tests"

[tasks."grammar:sync"]
    description = "Package shared TextMate grammars with giallo registration metadata"
    run         = "uv run --no-project python scripts/sync_grammars.py"

[tasks."grammar:check"]
    description = "Check grammar packaging, shared detection cases and optional Kakoune lifecycle"
    run         = [
        "uv run --no-project python -m unittest discover -s tests -p test_sync_grammars.py -v",
        "uv run --no-project python -m unittest discover -s tests -p test_docassemble.py -v",
    ]

[tasks.test]
    description = "Check highlighting in real Kakoune (loud skip without kak/giallo-kak)"
    run         = "uv run --no-project python scripts/check_highlighting.py"

[tasks."lsp:test"]
    description = "Live kak-lsp v22 wiring/cross-file checks (opt-in: DOCASSEMBLE_LSP_LIVE_KAKOUNE=1)"
    run         = "uv run --no-project python -m unittest discover -s tests -p test_docassemble_lsp.py -v"

[tasks.check]
    description = "Validate Kakoune detection, highlighting and optional LSP integration"
    depends     = ["format:check", "lint", "grammar:check", "test", "lsp:test"]
