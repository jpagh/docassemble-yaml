monorepo_root = true

[env]
    DYLD_FALLBACK_LIBRARY_PATH = "/opt/homebrew/lib"

[tools]
    tombi                  = "latest"
    "pipx:bump-my-version" = "latest"

[monorepo]
    config_roots = ["fresh", "lsp", "vscode", "tools/scope-parity"]

[tasks."format:toml"]
    description = "Format TOML files with tombi (uses root .tombi.toml)"
    run         = "tombi format"

[tasks."format:toml:check"]
    description = "Check TOML formatting with tombi"
    run         = "tombi format --check"

[tasks."lint:toml"]
    description = "Lint TOML files with tombi"
    run         = "tombi lint"

[tasks.check]
    description = "Check formatting, lint, type, and test the whole monorepo"
    depends     = [
        "//:format:toml:check",
        "//lsp:check",
        "//vscode:check",
        "//fresh:check",
        "//tools/scope-parity:check",
    ]

[tasks.gate]
    description = "Full pre-release gate for the whole monorepo"
    depends     = [
        "//:format:toml:check",
        "//lsp:gate",
        "//vscode:gate",
        "//fresh:check",
        "//tools/scope-parity:gate",
    ]

[tasks.bump]
    description = "Bump the patch digit (CalVer YY.MM.patch → YY.MM.patch+1) and push"
    tools       = { node = "latest", uv = "latest" }
    # The version-bump commit only touches version metadata, the changelog,
    # and lockfiles; `mise run gate` already validated the tree right before
    # this in `publish`. Skip the git pre-commit hook so the VS Code test
    # suite and the rest of `check` don't run a second time.
    run         = "MISE_SKIP_PRE_COMMIT=1 bump-my-version bump patch && git push --follow-tags"

[tasks.publish]
    description = "Full release: gate, bump patch, package VSIX, publish to marketplace"
    run         = [
        { task = "gate" },
        { task = "bump" },
        { task = "//vscode:publish" },
    ]

[tasks."release:github"]
    description = "Create the GitHub Release for the current VERSION (CHANGELOG section + generated notes); publishing it triggers the PyPI workflow"
    run         = "scripts/github-release.sh"

[tasks.deploy]
    description = "Full deploy: gate, bump patch, publish VSIX, then create the GitHub Release (which triggers PyPI publishing)"
    run         = [
        { task = "publish" },
        { task = "release:github" },
    ]

[tasks.pre-commit]
    description = "Format and check the whole monorepo"
    run         = [
        { tasks = ["//lsp:format", "//vscode:format"] },
        { task = "check" },
    ]

[tasks.lint]
    description = "Lint the whole monorepo"
    depends     = ["//lsp:lint", "//vscode:lint"]

[tasks.format]
    description = "Format the whole monorepo"
    depends     = ["//lsp:format", "//vscode:format"]
