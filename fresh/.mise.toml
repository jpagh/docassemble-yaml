[tools]
    "pipx:ruff" = "latest"
    uv          = "latest"

[tasks.format]
    description = "Format the grammar generator with ruff"
    run         = "ruff format"

[tasks."format:check"]
    description = "Check the grammar generator's formatting (and TOML)"
    depends     = ["//:format:toml:check"]
    run         = "ruff format --check"

[tasks.lint]
    description = "Lint the generator and validate the pack manifest (and TOML)"
    depends     = ["//:lint:toml"]
    run         = ["ruff check", "bash -n validate.sh", "./validate.sh"]

[tasks."grammar:check"]
    description = "Fail if the committed grammar is invalid or stale"
    run         = "uv run --quiet --no-project --with pyyaml python scripts/check_grammar.py"

[tasks.check]
    description = "Format-check, lint, and validate the Fresh language pack"
    depends     = ["format:check", "lint", "grammar:check"]
