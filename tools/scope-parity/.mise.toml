[tools]
    node        = "latest"
    "pipx:ruff" = "latest"
    uv          = "latest"

[tasks."format"]
    description = "Format Rust and Python sources"
    tools       = { rust = "latest" }
    run         = ["cargo fmt", "ruff format *.py"]

[tasks."format:check"]
    description = "Check JS and Python formatting (and TOML); no Rust required"
    depends     = ["//:format:toml:check"]
    run         = [
        "node --check node/tokenize.mjs",
        "node --check node/compatibility-reference.mjs",
        "node --check node/tokenize-test-helper.mjs",
        "node --check node/tokenize-shipped.test.mjs",
        "node --check node/tokenize-compatibility.test.mjs",
        "node --check node/tokenize-corpus.test.mjs",
        "ruff format --check *.py",
    ]

[tasks.lint]
    description = "Lint Python and validate the JSON/YAML inputs (and TOML)"
    depends     = ["//:lint:toml"]
    run         = [
        "ruff check *.py",
        "uv run --quiet --no-project --with pyyaml python lint.py",
    ]

[tasks."format:rust:check"]
    description = "Rust formatting; separate from dependency-light check"
    tools       = { rust = "latest" }
    run         = "cargo fmt --check"

[tasks."test:unit"]
    description = "Offset normalization and exact exception accounting (no engines)"
    run         = "uv run --no-project python -m unittest discover -p 'test_*.py' -v"

[tasks."test:rust"]
    description = "Diagnostic theme inversion and wrong-category negative control"
    tools       = { rust = "latest" }
    run         = "cargo test --release"

[tasks."lint:rust"]
    tools       = { rust = "latest" }
    description = "Clippy; compiles the syntect harness, so pre-release only"
    run         = "cargo clippy --release --all-targets -- -D warnings"

[tasks.check]
    description = "Fast checks: formatting, lint, and input validation"
    depends     = [
        "format:check",
        "lint",
        "test:reference",
        "test:unit",
        "test:shipped"
    ]

[tasks."node:sync"]
    description = "Install the locked TextMate test dependencies"
    run         = "npm ci --prefix node --silent"

[tasks."test:shipped"]
    description = "Direct tests of unmodified shipped TextMate grammars (no reference patches)"
    depends     = ["node:sync"]
    run         = "node --test node/tokenize-shipped.test.mjs node/tokenize-corpus.test.mjs"

[tasks."test:reference"]
    description = "Check explicit compatibility-reference mode stays distinct from shipped behavior"
    depends     = ["node:sync"]
    run         = "node --test node/tokenize-compatibility.test.mjs"

[tasks.test]
    description = "Canonical TextMate/giallo and compatibility TextMate/syntect parity"
    tools       = { rust = "latest" }
    depends     = ["node:sync"]
    run         = "./run.sh"

[tasks.gate]
    description = "Fast checks, clippy, and the parity run"
    depends     = ["check", "format:rust:check", "lint:rust", "test:rust", "test"]
