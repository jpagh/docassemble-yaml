[tools]
    aube               = "latest"
    node               = "latest"
    "npm:typescript"   = "latest"
    "npm:esbuild"      = "latest"
    "npm:oxlint"       = "latest"
    "npm:oxfmt"        = "latest"
    "npm:@vscode/vsce" = "latest"

[tasks.sync]
    description = "Install vscode runtime dependencies via aube"
    run         = "aube install"

[tasks."bundle:server"]
    description = "Bundle the Python LSP into vscode/bundled/"
    depends     = ["//lsp:sync"]
    run         = "node scripts/bundle-server.mjs"

[tasks.compile]
    description = "TypeScript compile only"
    depends     = ["sync"]
    run         = "tsc -p ./"

[tasks."grammar:sync"]
    description = "Copy shared canonical TextMate grammars into the VS Code package"
    run         = "node scripts/sync-grammars.mjs"

[tasks."grammar:check"]
    description = "Check packaged TextMate grammar copies against shared sources"
    run         = "node scripts/sync-grammars.mjs --check"

[tasks.build]
    description = "Full build: bundle server + tsc + esbuild bundle"
    depends     = ["bundle:server", "compile", "grammar:check"]
    run         = "esbuild src/extension.ts --bundle --outfile=dist/extension.js --external:vscode --platform=node --target=node18 --format=cjs --sourcemap=external --minify"

[tasks.format]
    description = "Format TS/JS (and //:format:toml)"
    depends     = ["sync", "//:format:toml"]
    run         = "oxfmt --write"

[tasks."format:check"]
    description = "Check TS/JS formatting"
    depends     = ["sync"]
    run         = "oxfmt --check"

[tasks.lint]
    description = "Lint TS/JS (and //:lint:toml)"
    depends     = ["sync", "//:lint:toml"]
    run         = "oxlint"

[tasks.test]
    description = "Run VS Code extension tests (mock LSP)"
    depends     = ["build"]
    run         = "DOCASSEMBLE_LSP_USE_SYSTEM_VSCODE=1 node ./dist/test/runTest.js"

[tasks."test:unit"]
    description = "Run Node unit tests"
    depends     = ["sync"]
    run         = "node --test scripts/*.test.mjs"

[tasks."test:real-lsp"]
    description = "Run extension tests against the real docassemble-lsp"
    depends     = ["build"]
    run         = "DOCASSEMBLE_LSP_ENABLE_REAL_TEST=1 DOCASSEMBLE_LSP_USE_SYSTEM_VSCODE=1 node ./dist/test/runTest.js"

[tasks."test:separate"]
    description = "Run extension tests against a separate VS Code (download)"
    depends     = ["build"]
    run         = "node ./dist/test/runTest.js"

[tasks.package]
    description = "Package the VSIX"
    depends     = ["build"]
    run         = "vsce package --no-dependencies"

[tasks.publish]
    description = "Publish the VSIX to the marketplace"
    depends     = ["package"]
    run         = "vsce publish --no-dependencies"

[tasks."check:metadata"]
    description = "Fail if vscode/package.json contains a __metadata block"
    depends     = ["sync"]
    run         = "node scripts/check-no-metadata.mjs"

[tasks.check]
    description = "Check formatting, lint, build, and unit tests (no extension host)"
    depends     = ["format:check", "lint", "build", "test:unit", "check:metadata"]

[tasks.watch]
    description = "Watch TypeScript"
    depends     = ["sync"]
    run         = "tsc -w -p ./"

[tasks.gate]
    description = "Full pre-release gate: mocked and real-LSP extension-host suites"
    depends     = ["format:check", "lint", "check:metadata", "test", "test:real-lsp"]
